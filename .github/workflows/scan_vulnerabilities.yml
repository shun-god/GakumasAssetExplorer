name: Scan Vulnerabilities

on:
    # Manual triggering only
    workflow_dispatch:

jobs:
    scan-vulnerabilities:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version-file: ".python-version"

            - name: Set up uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                  version: "0.13.9"

            - name: Export locked dependencies for scanners
              run: uv export --locked --no-emit-project --output-file requirements.txt

            - name: Set up CodeQL
              uses: github/codeql-action/init@v3
              with:
                  languages: python

            - name: Scan Code with CodeQL
              uses: github/codeql-action/analyze@v3
              continue-on-error: true

            - name: Scan Code with Bandit
              run: uvx bandit -r . -ll
              continue-on-error: true

            - name: Scan Dependencies with pip-audit
              run: uvx pip-audit --require-hashes -r requirements.txt
              continue-on-error: true

            - name: Scan Dependencies with Safety
              uses: pyupio/safety-action@v1
              with:
                  api-key: ${{ secrets.SAFETY_API_KEY }}
              continue-on-error: true
